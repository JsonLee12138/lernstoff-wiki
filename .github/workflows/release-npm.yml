name: Release npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (e.g. beta, next, latest)"
        required: true
        default: "beta"

jobs:
  publish:
    name: Publish Packages to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality & Lint Check
        run: pnpm check

      - name: Build Monorepo (tsdown)
        run: pnpm build

      - name: Run Test Suites
        run: pnpm test --run

      - name: Determine npm dist-tag
        id: tag-step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dist_tag=${{ github.event.inputs.dist_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-alpha"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
            echo "dist_tag=beta" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: |
          pnpm -r publish --no-git-checks --access public --tag ${{ steps.tag-step.outputs.dist_tag }} --provenance
